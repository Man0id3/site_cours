<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Espaces de Cours</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ÉCRAN DE CONNEXION -->
  <div id="auth-container" class="card" style="max-width: 400px; margin: 80px auto; padding: 2rem;">
    <h2 style="text-align: center; margin-bottom: 1.5rem;">Connexion</h2>
    <form id="login-form">
      <input type="email" id="auth-email" placeholder="E-mail" required style="margin-bottom: 1rem;">
      <input type="password" id="auth-password" placeholder="Mot de passe" required style="margin-bottom: 1.5rem;">
      <button type="submit" class="btn-primary" style="width: 100%;">Se connecter</button>
    </form>
    <p id="auth-error" style="color: #dc2626; margin-top: 1rem; text-align: center; display: none;"></p>
  </div>

  <!-- CONTENU DU SITE -->
  <div id="app-container" class="hidden">
    <header>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h1 style="margin: 0;">Mon Espace d'Apprentissage</h1>
        <button id="btn-logout" class="btn-danger">Déconnexion</button>
      </div>
      <div class="add-subject-bar">
        <input type="text" id="new-subject-name" placeholder="Nouvelle matière (ex: SES, SVT)...">
        <button id="add-subject-btn" class="btn-primary">+ Ajouter Matière</button>
      </div>
      <nav id="subject-nav" class="subject-nav-tabs"></nav>
    </header>

    <main>
      <h2 id="current-subject-title">Sélectionnez ou créez une matière</h2>

      <div id="view-toggle" class="view-toggle-tabs hidden">
        <button id="btn-view-courses" class="tab-btn active">📖 Cours</button>
        <button id="btn-view-method" class="tab-btn">📌 Fiches Méthode</button>
        <button id="btn-view-dico" class="tab-btn">🔤 Dictionnaire</button>
      </div>

      <!-- SECTION COURS -->
      <section id="section-courses" class="view-section hidden">
        <button id="btn-show-add-course" class="btn-primary" style="margin-bottom: 1rem;">+ Ajouter un cours</button>

        <div id="course-form" class="card form-card hidden">
          <h3 id="form-course-title">Ajouter un cours</h3>
          <input type="text" id="course-title-input" placeholder="Titre du cours...">
          
          <!-- Éditeur WYSIWYG -->
          <div class="editor-toolbar">
            <button type="button" onclick="execCmd('bold')"><b>B</b></button>
            <button type="button" onclick="execCmd('italic')"><i>I</i></button>
            <button type="button" onclick="execCmd('underline')"><u>U</u></button>
            <input type="color" onchange="applyColor(this.value)" title="Couleur de texte">
            <input type="color" onchange="applyHighlight(this.value)" title="Surligner">
          </div>
          <div id="editor-content" contenteditable="true" class="editor-area" placeholder="Rédigez votre cours ici..."></div>

          <!-- Fichiers joints -->
          <div class="file-inputs-grid">
            <label>Image : <input type="file" id="image-input" accept="image/*"></label>
            <label>PDF : <input type="file" id="pdf-input" accept="application/pdf"></label>
            <label>Audio : <input type="file" id="audio-input" accept="audio/*"></label>
            <label>Vidéo : <input type="file" id="video-input" accept="video/*"></label>
          </div>

          <!-- Liens associés -->
          <div class="links-input-group">
            <h4>Liens utiles</h4>
            <div style="display: flex; gap: 0.5rem; margin-bottom: 0.5rem;">
              <input type="text" id="link-title-input" placeholder="Nom du lien">
              <input type="url" id="link-url-input" placeholder="https://...">
              <button type="button" id="btn-add-link-item" class="btn-secondary">+</button>
            </div>
            <ul id="links-preview-list"></ul>
          </div>

          <div class="form-actions">
            <button id="btn-save-course" class="btn-primary">Enregistrer</button>
            <button id="btn-cancel-course" class="btn-secondary">Annuler</button>
          </div>
        </div>

        <div id="courses-list" class="grid-list"></div>
      </section>

      <!-- SECTION FICHES MÉTHODE -->
      <section id="section-method" class="view-section hidden">
        <button id="btn-show-add-method" class="btn-primary" style="margin-bottom: 1rem;">+ Ajouter une méthode</button>

        <div id="method-form" class="card form-card hidden">
          <h3 id="form-method-title">Ajouter une fiche méthode</h3>
          <input type="text" id="method-title-input" placeholder="Titre de la méthode...">
          
          <div class="editor-toolbar">
            <button type="button" onclick="execCmd('bold')"><b>B</b></button>
            <button type="button" onclick="execCmd('italic')"><i>I</i></button>
            <button type="button" onclick="execCmd('underline')"><u>U</u></button>
          </div>
          <div id="method-editor-content" contenteditable="true" class="editor-area"></div>

          <div class="form-actions">
            <button id="btn-save-method" class="btn-primary">Enregistrer</button>
            <button id="btn-cancel-method" class="btn-secondary">Annuler</button>
          </div>
        </div>

        <div id="methods-list" class="grid-list"></div>
      </section>

      <!-- SECTION DICTIONNAIRE -->
      <section id="section-dico" class="view-section hidden">
        <div class="card form-card">
          <h3>Ajouter une notion au dictionnaire</h3>
          <input type="text" id="notion-term-input" placeholder="Mot ou terme (ex: Inflation)...">
          <textarea id="notion-def-input" placeholder="Définition..."></textarea>
          <button id="btn-save-notion" class="btn-primary" style="margin-top: 0.5rem;">Enregistrer la notion</button>
        </div>

        <div id="dico-list" class="grid-list"></div>
      </section>
    </main>
  </div>

  <!-- MODALE LECTURE COURS / MÉTHODE -->
  <div id="course-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn" onclick="closeCourseModal()">&times;</span>
      <h2 id="modal-course-title"></h2>
      <div id="modal-course-body" class="modal-body-text"></div>
      <div id="modal-course-media"></div>
      <h4>Liens associés :</h4>
      <div id="modal-course-links"></div>
    </div>
  </div>

  <!-- MODALE NOTION / DICTIONNAIRE -->
  <div id="notion-modal" class="modal hidden">
    <div class="modal-content">
      <span class="close-btn" onclick="closeNotionModal()">&times;</span>
      <h3 id="notion-modal-term"></h3>
      <p id="notion-modal-def"></p>
      <hr>
      <p>Consulter sur : 
        <a id="link-robert" href="#" target="_blank">Le Robert</a> | 
        <a id="link-larousse" href="#" target="_blank">Larousse</a> | 
        <a id="link-wiki" href="#" target="_blank">Wikipédia</a>
      </p>
    </div>
  </div>

  <!-- SCRIPTS FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

  <!-- TON SCRIPT PRINCIPAL -->
  <script src="script.js"></script>
</body>
</html>
